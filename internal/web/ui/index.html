<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash 콘솔</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div x-data="stashConsole()" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Stash 콘솔
                </h1>
                <div class="flex items-center gap-4">
                    <a x-cloak x-show="auth.mode === 'oidc' && !auth.authenticated" href="/auth/login" class="text-sm hover:underline">로그인</a>
                    <div x-cloak x-show="auth.authenticated" class="flex items-center gap-3 text-sm">
                        <span x-text="auth.user"></span>
                        <button @click="logout" class="hover:underline">로그아웃</button>
                    </div>
                    <div class="relative">
                        <input type="password" x-model="token" @change="normalizeToken" placeholder="API 토큰 (선택)" class="px-3 py-1 rounded text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 w-64" title="이 탭에서 사용할 API 토큰">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full flex flex-col md:flex-row gap-6">
            <!-- Sidebar / Controls -->
            <aside class="w-full md:w-64 flex flex-col gap-4">
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">조회</h2>
                    <nav class="flex flex-col gap-2">
                        <button @click="callTool('list_namespaces', {limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">네임스페이스</button>
                        <button @click="callTool('query_facts', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">사실</button>
                        <button @click="callTool('list_hypotheses', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">가설</button>
                        <button @click="callTool('list_goals', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">목표</button>
                    </nav>
                </div>
            </aside>

            <!-- Results Panel -->
            <section class="flex-grow bg-white rounded-lg shadow-sm border border-gray-100 flex flex-col">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-lg">
                    <h2 class="font-semibold text-gray-700">결과</h2>
                    <span x-show="loading" class="text-sm text-indigo-500 flex items-center gap-1" x-cloak>
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        불러오는 중...
                    </span>
                </div>
                <div class="p-0 flex-grow relative overflow-hidden bg-gray-900 rounded-b-lg">
                    <textarea readonly x-model="result" class="w-full h-full min-h-[500px] p-4 bg-transparent text-green-400 font-mono text-sm focus:outline-none resize-none" spellcheck="false"></textarea>
                </div>
            </section>
        </main>
    </div>

    <script>
        function stashConsole() {
            return {
                token: '',
                sessionId: '',
                requestId: 0,
                auth: { mode: 'none', authenticated: false, user: '' },
                result: 'Stash 콘솔입니다.\n\nAPI 토큰을 입력한 뒤 왼쪽 조회 항목을 선택하세요.',
                loading: false,

                init() {
                    this.loadAuthStatus();
                },

                normalizeToken() {
                    this.token = this.token.trim();
                },

                async loadAuthStatus() {
                    try {
                        const res = await fetch('/auth/status');
                        if (res.ok) {
                            this.auth = await res.json();
                        }
                    } catch (_) {
                        // Authentication status is optional when auth is disabled.
                    }
                },

                async logout() {
                    await fetch('/auth/logout', { method: 'POST' });
                    this.sessionId = '';
                    window.location.reload();
                },

                async callTool(toolName, args) {
                    this.loading = true;
                    this.result = '불러오는 중...';
                    try {
                        const run = async () => {
                            await this.initializeSession();
                            return this.sendMCPRequest('tools/call', { name: toolName, arguments: args });
                        };
                        let data;
                        try {
                            data = await run();
                        } catch (e) {
                            // A server restart invalidates the previous session ID.
                            if (e.status === 404 && this.sessionId) {
                                this.sessionId = '';
                                data = await run();
                            } else {
                                throw e;
                            }
                        }
                        // Pretty print the content if it's JSON inside the text
                        if (data.result && data.result.content && data.result.content.length > 0) {
                            try {
                                const innerJson = JSON.parse(data.result.content[0].text);
                                this.result = JSON.stringify(innerJson, null, 2);
                            } catch (e) {
                                this.result = JSON.stringify(data, null, 2);
                            }
                        } else {
                            this.result = JSON.stringify(data, null, 2);
                        }
                    } catch (e) {
                        this.result = '오류: ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async initializeSession() {
                    if (this.sessionId) {
                        return;
                    }
                    await this.sendMCPRequest('initialize', {
                        protocolVersion: '2025-11-25',
                        capabilities: {},
                        clientInfo: { name: 'stash-console', version: '0.2.8' }
                    });
                    await this.sendMCPRequest('notifications/initialized', {}, true, true);
                },

                async sendMCPRequest(method, params, returnResponse = true, notification = false) {
                    const headers = {
                        'Accept': 'application/json, text/event-stream',
                        'Content-Type': 'application/json'
                    };
                    if (this.token) {
                        headers['Authorization'] = 'Bearer ' + this.token;
                    }
                    if (this.sessionId) {
                        headers['Mcp-Session-Id'] = this.sessionId;
                    }

                    const body = { jsonrpc: '2.0', method, params };
                    if (!notification) {
                        body.id = ++this.requestId;
                    }
                    const res = await fetch('/mcp', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const error = new Error(`HTTP 오류 ${res.status}: ${res.statusText}`);
                        error.status = res.status;
                        throw error;
                    }
                    const responseSessionId = res.headers.get('Mcp-Session-Id');
                    if (responseSessionId) {
                        this.sessionId = responseSessionId;
                    }
                    if (notification || !returnResponse) {
                        return null;
                    }
                    return res.json();
                }
            }
        }
    </script>
</body>
</html>
