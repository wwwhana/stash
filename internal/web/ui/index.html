<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash Web Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div x-data="stashAdmin()" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Stash Admin
                </h1>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <input type="password" x-model="token" @change="saveToken" placeholder="SSO Bearer Token" class="px-3 py-1 rounded text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 w-64" title="Authentication Token for SSO">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full flex flex-col md:flex-row gap-6">
            <!-- Sidebar / Controls -->
            <aside class="w-full md:w-64 flex flex-col gap-4">
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Explore</h2>
                    <nav class="flex flex-col gap-2">
                        <button @click="callTool('list_namespaces', {limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">List Namespaces</button>
                        <button @click="callTool('query_facts', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">Query Facts</button>
                        <button @click="callTool('list_hypotheses', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">List Hypotheses</button>
                        <button @click="callTool('list_goals', {namespaces: '/', limit: 100})" class="text-left px-3 py-2 rounded hover:bg-indigo-50 hover:text-indigo-600 transition-colors">List Goals</button>
                    </nav>
                </div>
            </aside>

            <!-- Results Panel -->
            <section class="flex-grow bg-white rounded-lg shadow-sm border border-gray-100 flex flex-col">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-lg">
                    <h2 class="font-semibold text-gray-700">JSON-RPC Result</h2>
                    <span x-show="loading" class="text-sm text-indigo-500 flex items-center gap-1" x-cloak>
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Loading...
                    </span>
                </div>
                <div class="p-0 flex-grow relative overflow-hidden bg-gray-900 rounded-b-lg">
                    <textarea readonly x-model="result" class="w-full h-full min-h-[500px] p-4 bg-transparent text-green-400 font-mono text-sm focus:outline-none resize-none" spellcheck="false"></textarea>
                </div>
            </section>
        </main>
    </div>

    <script>
        function stashAdmin() {
            return {
                token: localStorage.getItem('stash_token') || '',
                result: 'Welcome to Stash Web Admin.\n\nEnter your token above and click an action on the left.',
                loading: false,

                saveToken() {
                    localStorage.setItem('stash_token', this.token);
                },

                async callTool(toolName, args) {
                    this.loading = true;
                    this.result = 'Loading...';
                    try {
                        const headers = { 'Content-Type': 'application/json' };
                        if (this.token) {
                            headers['Authorization'] = 'Bearer ' + this.token;
                        }
                        const res = await fetch('/mcp', {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({
                                jsonrpc: "2.0",
                                id: Date.now(),
                                method: "tools/call",
                                params: { name: toolName, arguments: args }
                            })
                        });
                        
                        if (!res.ok) {
                            const txt = await res.text();
                            this.result = `HTTP Error ${res.status}: ${res.statusText}\n${txt}`;
                            return;
                        }

                        const data = await res.json();
                        // Pretty print the content if it's JSON inside the text
                        if (data.result && data.result.content && data.result.content.length > 0) {
                            try {
                                const innerJson = JSON.parse(data.result.content[0].text);
                                this.result = JSON.stringify(innerJson, null, 2);
                            } catch (e) {
                                this.result = JSON.stringify(data, null, 2);
                            }
                        } else {
                            this.result = JSON.stringify(data, null, 2);
                        }
                    } catch (e) {
                        this.result = 'Error: ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
