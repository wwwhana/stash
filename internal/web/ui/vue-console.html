<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Stash</title>
    <script>
        (() => {
            const apply = () => {
                let preference = 'system';
                try {
                    const stored = localStorage.getItem('stash.theme');
                    if (['system', 'light', 'dark'].includes(stored)) preference = stored;
                } catch (_) { /* 시스템 설정 사용 */ }
                const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.stashThemePreference = preference;
                document.documentElement.dataset.stashTheme = dark ? 'dark' : 'light';
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            };
            apply();
            const media = matchMedia('(prefers-color-scheme: dark)');
            if (media.addEventListener) media.addEventListener('change', apply);
            window.addEventListener('storage', event => {
                if (event.key === 'stash.theme') apply();
            });
            window.stashConsoleApplyTheme = apply;
        })();
    </script>
    <link rel="stylesheet" href="/vue-console.css">
    <script>window.process = window.process || { env: { NODE_ENV: 'production' } };</script>
</head>
<body>
    <div id="stash-vue-console" data-stash-vue-console></div>
    <script src="/route-state.js"></script>
    <script src="/api-client.js"></script>
    <script src="/search-utils.js"></script>
    <script src="/goal-map-layout.js"></script>
    <script src="/work-graph-layout.js"></script>
    <script src="/vue-monitor.js"></script>
    <script src="/vue-console.js"></script>
</body>
</html>
