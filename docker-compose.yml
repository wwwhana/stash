services:
  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: stash
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Stash MCP server + background consolidation
  stash:
    build: .
    command:
      - "mcp"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--with-consolidation"
      - "--consolidate-namespaces=/projects"
      - "--consolidate-namespaces=/users"
      - "--consolidate-namespaces=/tooling"
      - "--consolidate-namespaces=/self"
      - "--consolidate-namespaces=/sso"
    ports:
      - "8080:8080"
    environment:
      # Required
      STASH_POSTGRES_DSN: ${STASH_POSTGRES_DSN:-postgresql://stash:stash_dev_password@postgres:5432/stash?sslmode=disable}
      STASH_VECTOR_DIM: ${STASH_VECTOR_DIM:-1536}
      STASH_MAX_RESULT_SIZE: ${STASH_MAX_RESULT_SIZE:-10000}
      # Leave the key empty for local or internal endpoints without authentication.
      STASH_OPENAI_API_KEY: ${STASH_OPENAI_API_KEY:-}
      STASH_OPENAI_BASE_URL: ${STASH_OPENAI_BASE_URL:-https://api.openai.com/v1}
      STASH_EMBEDDING_MODEL: ${STASH_EMBEDDING_MODEL:-text-embedding-3-small}
      STASH_REASONER_MODEL: ${STASH_REASONER_MODEL:-gpt-4o-mini}
      STASH_CONTEXT_TTL: 1h
      STASH_HTTP_ADDR: :8080
      STASH_LOG_LEVEL: info
      STASH_LOG_FORMAT: text
      STASH_AUTH_MODE: ${STASH_AUTH_MODE:-none}
      STASH_AUTH_ISSUER: ${STASH_AUTH_ISSUER:-}
      STASH_AUTH_CLIENT_ID: ${STASH_AUTH_CLIENT_ID:-}
      STASH_AUTH_MCP_CLIENT_ID: ${STASH_AUTH_MCP_CLIENT_ID:-}
      STASH_AUTH_CLIENT_SECRET: ${STASH_AUTH_CLIENT_SECRET:-}
      STASH_AUTH_REDIRECT_URL: ${STASH_AUTH_REDIRECT_URL:-}
      STASH_AUTH_API_SECRET: ${STASH_AUTH_API_SECRET:-}
      STASH_AUTH_MCP_RESOURCE_URL: ${STASH_AUTH_MCP_RESOURCE_URL:-}
      STASH_AUTH_COOKIE_SECURE: ${STASH_AUTH_COOKIE_SECURE:-true}
      STASH_AUTH_TOKEN_TTL: ${STASH_AUTH_TOKEN_TTL:-720h}
      # Optional consolidation configs
      STASH_CONSOLIDATION_BATCH_SIZE: 100
      STASH_CONSOLIDATION_SIMILARITY_THRESHOLD: 0.85
      STASH_CONSOLIDATION_DEDUP_THRESHOLD: 0.95
      STASH_CONSOLIDATION_WINDOW: 168h
      STASH_DECAY_FACTOR: 0.95
      STASH_EXPIRY_THRESHOLD: 0.1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/stash", "env"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
